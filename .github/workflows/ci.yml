name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - bate

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        run: rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked

      - name: Test Tauri backend and input helper
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
